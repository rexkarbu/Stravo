name: stravo
description: "Stravo Pro - Offline Fitness Tracking"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Demo Spike: WebView + local tile server
  webview_flutter: ^4.13.0
  webview_flutter_android: ^4.14.1
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  sqlite3: ^2.7.5
  sqlite3_flutter_libs: ^0.5.31
  path_provider: ^2.1.5
  path: ^1.9.1
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/map_engine/
    - assets/demo_pack/kamojang/
    - assets/demo_pack/kamojang/glyphs/Open Sans Regular/
